pipeline:
  name: GeneralSpringBootProgExce - pipeline
  identifier: GeneralSpringBootProgExce_pipeline
  projectIdentifier: cicdproject
  orgIdentifier: default
  tags: {}
  properties:
    ci:
      codebase:
        connectorRef: GitHubconnector
        repoName: GeneralSpringBootProgExce
        build: <+input>
  stages:
    - stage:
        name: BUILD
        identifier: BUILD
        description: ""
        type: CI
        spec:
          cloneCodebase: true
          caching:
            enabled: true
            override: true
          buildIntelligence:
            enabled: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: Run
                  name: Build-Stage
                  identifier: BuildStage
                  spec:
                    shell: Bash
                    command: mvn clean package
              - step:
                  type: Run
                  name: Test-Stage
                  identifier: TestStage
                  spec:
                    shell: Bash
                    command: mvn test
